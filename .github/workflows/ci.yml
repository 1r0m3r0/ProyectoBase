name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check all modules (compileall)
        run: |
          python -m compileall -q \
            core exchange_connector strategies backtesting notifications \
            portafolio_manager main.py trading_bot_structure.py
